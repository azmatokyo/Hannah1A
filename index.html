<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Star School 🌟</title><meta name="theme-color" content="#fff4bd"><style>
:root{font-family:"Trebuchet MS","Arial Rounded MT Bold","Noto Sans Thai",system-ui,-apple-system,sans-serif;color:#46364b;background:#fffaf0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff8dd,#fff)}main{max-width:980px;margin:auto;padding:14px 14px 70px}.card,.hero{background:#fff;border:3px solid #ead7e8;border-radius:26px;padding:18px;margin:12px 0;box-shadow:0 5px 0 #eee1e9}.hero{text-align:center;background:linear-gradient(135deg,#fff0a8,#ffd1e6,#d8f2ff);border-color:#efc34d}h1{font-size:clamp(32px,6vw,58px);margin:5px;color:#8b4c78}h2{font-size:clamp(26px,4.5vw,40px);margin:8px}h3{font-size:clamp(22px,3.4vw,30px)}p{line-height:1.55}.btn,.subject,.choice,.age{font:inherit;cursor:pointer;touch-action:manipulation}.btn{border:0;border-radius:17px;padding:15px 18px;margin:6px;font-size:clamp(19px,3vw,27px);font-weight:850;background:#9654b1;color:white}.btn.gold{background:#edab18;color:#4c3300}.btn.soft{background:#f5e8f7;color:#664172;border:2px solid #d7b9dc}.btn.danger{background:#fff0f0;color:#9b3535;border:2px solid #e5a7a7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{position:relative;overflow:hidden;border:3px solid #e5d4e5;border-radius:28px;background:linear-gradient(145deg,#fff,#fff9fd);padding:18px;min-height:190px;text-align:left;font-weight:900;font-size:clamp(21px,3.4vw,30px);box-shadow:0 8px 18px #eadfeb80;transition:.15s transform}.subject:active{transform:scale(.98)}.subject .subtop{display:flex;align-items:center;justify-content:space-between;gap:12px}.subject .subname{font-size:clamp(24px,3.5vw,34px);letter-spacing:-.4px}.subject .mascot{font-size:64px;filter:drop-shadow(0 4px 2px #0001)}.subject.thai{background:linear-gradient(145deg,#fff5fb,#fff)}.subject.math{background:linear-gradient(145deg,#fff8d9,#fff)}.subject.learn{background:linear-gradient(145deg,#eaf9ff,#fff)}.subject.iq{background:linear-gradient(145deg,#f1ecff,#fff)}.subject.eng{background:linear-gradient(145deg,#eef1ff,#fff7fb)}.subject.arabic{background:linear-gradient(145deg,#ecfff1,#fffbed)}.subject.islam{background:linear-gradient(145deg,#eafaf1,#fff)}.subject small{display:block;font-size:16px;font-weight:600;color:#7b687a;margin-top:7px}.topic{min-height:105px}.input{width:100%;font:inherit;font-size:28px;padding:15px;border:3px solid #dbc6df;border-radius:16px;text-align:center}.ages{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.age{font-size:26px;font-weight:900;border:3px solid #e1c9df;background:#fff;border-radius:18px;padding:14px 20px}.age.sel{background:#ffe59b;border-color:#e3aa16}.q{font-size:clamp(29px,5vw,49px);font-weight:900;text-align:center;margin:14px 0}.visual{text-align:center;font-size:clamp(64px,12vw,120px);line-height:1.3;min-height:100px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{border:4px solid #ead8e8;background:#fffdf8;border-radius:22px;min-height:130px;padding:10px;font-size:clamp(34px,7vw,72px);font-weight:900;overflow-wrap:anywhere}.choice.text{font-size:clamp(23px,4vw,38px)}.choice.correct{background:#dcf8df;border-color:#42aa63}.choice.wrong{background:#ffe5e8;border-color:#df7081}.feedback{border-radius:22px;padding:15px;text-align:center;background:#fff1ae;border:3px solid #edbb2d;margin-top:14px}.feedback .yay{font-size:clamp(42px,8vw,78px);font-weight:1000}.explain{font-size:clamp(19px,3vw,27px);font-weight:700}.bar{height:15px;background:#eee5ed;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#edb42b}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:7px 12px;border-radius:99px;background:#fff1ba;font-weight:800}.muted{color:#776878;font-size:16px}.hidden{display:none!important}.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.matchcol{display:grid;gap:10px}.matchbtn{min-height:90px;border:3px solid #decde0;border-radius:18px;background:white;font-size:clamp(30px,6vw,60px);font-weight:900}.matchbtn.selected{outline:5px solid #f0b62c}.matchbtn.done{background:#ddf7e1;border-color:#5ab874}.history{width:100%;border-collapse:collapse}.history th,.history td{padding:9px;border-bottom:1px solid #eaddea;text-align:left}.badge{font-size:17px;background:#eaf7ff;border-radius:12px;padding:5px 9px}.celebrate{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.15)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.choices{grid-template-columns:repeat(3,1fr)}.choice{min-height:105px}.card{padding:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.subject{padding:0;min-height:250px;text-align:center}.subject .subtop{display:block}.subject-art{width:100%;height:145px;object-fit:cover;display:block;border-radius:24px 24px 0 0}.subject-copy{padding:15px 16px 17px}.subject .subname{display:block;font-size:clamp(25px,3.5vw,35px);font-weight:850;color:#493a67}.subject small{font-size:16px;line-height:1.45}.subject .mascot{display:none!important}.hero h1{font-family:"Arial Rounded MT Bold","Avenir Next Rounded","Noto Sans Thai",system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
.version-badge{display:inline-block;margin:8px 0 10px;padding:7px 12px;border-radius:999px;background:#fff1b8;color:#795c1f;font-weight:800}.kids-hero-picture{width:100%;max-width:1180px;display:block;margin:14px auto 22px;border-radius:30px;box-shadow:0 14px 35px rgba(80,70,120,.16);border:4px solid rgba(255,255,255,.9)}
:root{font-family:"Avenir Next Rounded","Arial Rounded MT Bold","Noto Sans Thai","Tahoma",system-ui,sans-serif}
body{letter-spacing:.05px}.q,h1,h2,h3,.subname{font-weight:800!important;letter-spacing:.1px!important}
.picimg{width:min(150px,100%);height:120px;object-fit:cover;border-radius:22px;display:block;margin:auto;box-shadow:0 7px 18px #8b6f9b22;border:3px solid #fff;background:#fff}
.visual .picimg{width:min(240px,80vw);height:180px}.choice .picimg{height:115px;width:100%;max-width:155px}
.voice-note{font-size:13px;color:#806f86;margin-top:4px}.choice{background:linear-gradient(145deg,#fff,#fffaf5)}

#approvedHome{max-width:1200px;margin:18px auto 24px;padding:0 14px;text-align:center}#approvedHome img{width:100%;display:block;border-radius:32px;border:5px solid rgba(255,255,255,.92);box-shadow:0 16px 42px rgba(78,66,118,.18)}#approvedHome .ver{margin:10px auto;color:#826a94;font-weight:700;font-size:14px}body,button,input{font-family:"Avenir Next Rounded","Arial Rounded MT Bold","Noto Sans Thai",Tahoma,system-ui,sans-serif!important}

.voice-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid #eee2ee}.voice-select{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid #dcc8e1;border-radius:14px;background:#fff}.voice-help{background:#fff7d8;border:2px solid #f0d67a;border-radius:16px;padding:12px;line-height:1.55}@media(max-width:720px){.voice-row{grid-template-columns:1fr}.voice-row .btn{width:100%}}

function welcome(){app.innerHTML=header()+`<section class="card center"><h2>สวัสดีหนูน้อยคนเก่ง 👋</h2><p>เกมเรียนรู้สำหรับเด็กปฐมวัยประมาณ <b>3–5 ปี</b></p><button id="helloSound" class="btn soft">เสียง แตะเพื่อเริ่มสนุก!</button><button id="voiceSetup" class="btn soft">ตั้งค่าเสียงผู้หญิง</button><div id="soundReady" class="muted"></div><label><b>หนูชื่ออะไรเอ่ย?</b></label><input id="name" class="input" maxlength="24" value="${state.player||''}" placeholder="ชื่อเล่น"><h3>หนูอายุเท่าไหร่?</h3><div class="ages">${[3,4,5].map(a=>`<button class="age ${selectedAge==a?'sel':''}" data-age="${a}">${a} ปี</button>`).join('')}</div><p class="muted">💡 แนะนำเล่นครั้งละประมาณ 10–15 นาที แล้วพักสายตาและขยับร่างกาย</p><button id="start" class="btn gold">เริ่มเรียน</button></section>`;document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{selectedAge=+b.dataset.age;welcome()});$('#helloSound').onclick=()=>{state.sound=true;save();const ok=speak('สวัสดีหนูน้อยคนเก่ง ยินดีต้อนรับสู่ Little Star School','th-TH');$('#soundReady').textContent=ok?'เสียงผู้หญิงพร้อมแล้ว':'ยังไม่พบเสียงผู้หญิงไทยในเครื่องนี้ — กด ตั้งค่าเสียงผู้หญิง';};$('#voiceSetup').onclick=voiceSettings;$('#start').onclick=()=>{let n=$('#name').value.trim();if(!n)return alert('ใส่ชื่อก่อนนะครับ 🌟');state.player=n;state.age=selectedAge;save();speak(`สวัสดี ${n} พร้อมมาเรียนรู้และสนุกกันหรือยัง?`,'th-TH');setTimeout(home,1200)}}

function startSubject(id){current=subjects.find(s=>s.id==id);let bank=[...current.bank]; while(bank.length<10)bank=[...bank,...current.bank];round=sh(bank).slice(0,10);qi=0;score=0;attempts=0;showQ()}
function sameLangVoices(lang){
  if(!('speechSynthesis'in window))return [];
  const locale=(lang||'th-TH').toLowerCase(), base=locale.split('-')[0];
  return speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(base));
}
function isKnownMaleVoice(name){
  return /\bmale\b|\bman\b|\bboy\b|pattara|maged|hamed|tarik|daniel|fred|ralph|bruce|jorge|carlos|yuri|thomas/i.test(name||'');
}
function femalePatterns(base){
  return ({
    th:[/premwadee/i,/kanya/i,/narisa/i,/nicha/i,/suda/i,/google.*ไทย/i,/thai.*female/i,/female.*thai/i],
    en:[/jenny/i,/aria/i,/ava/i,/samantha/i,/zira/i,/serena/i,/karen/i,/moira/i,/tessa/i,/victoria/i,/fiona/i,/allison/i,/susan/i,/female/i,/woman/i],
    ar:[/salma/i,/laila/i,/mariam/i,/zeina/i,/amira/i,/female/i,/woman/i]
  }[base]||[/female/i,/woman/i]);
}
function pickKidVoice(lang){
  const locale=(lang||'th-TH').toLowerCase(), base=locale.split('-')[0];
  const same=sameLangVoices(locale);
  const saved=state.voicePrefs&&state.voicePrefs[base];
  if(saved){const exact=same.find(v=>v.name===saved&&!isKnownMaleVoice(v.name));if(exact)return exact;}
  for(const rx of femalePatterns(base)){
    const v=same.find(x=>rx.test(x.name)&&!isKnownMaleVoice(x.name));
    if(v)return v;
  }
  // IMPORTANT: do not silently fall back to an unknown/male voice.
  return null;
}
function speak(text,lang){
  if(!state.sound||!('speechSynthesis'in window))return false;
  speechSynthesis.cancel();
  const locale=lang||'th-TH';
  const v=pickKidVoice(locale);
  if(!v){console.warn('Little Star School: no approved female voice for',locale);return false;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=locale;
  u.rate=1.0;
  u.pitch=1.14;
  u.volume=1;
  u.voice=v;
  speechSynthesis.speak(u);
  return true;
}
function voiceSettings(){
  const groups=[['th','th-TH','ภาษาไทย','สวัสดีหนูน้อยคนเก่ง พร้อมมาเล่นกันหรือยัง'],['en','en-US','English','Hello little star! Are you ready to learn and play?'],['ar','ar','العربية','مرحباً يا نجمتي الصغيرة']];
  const rows=groups.map(([base,lang,label,sample])=>{
    const vs=sameLangVoices(lang).filter(v=>!isKnownMaleVoice(v.name));
    const selected=(state.voicePrefs&&state.voicePrefs[base])||'';
    return `<div class="voice-row"><b>${label}</b><select class="voice-select" data-base="${base}" data-lang="${lang}">${vs.length?vs.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${v.name===selected?'selected':''}>${v.name}</option>`).join(''):'<option value="">ไม่พบเสียงผู้หญิงที่รองรับในเครื่องนี้</option>'}</select><button class="btn soft voice-test" data-base="${base}" data-lang="${lang}" data-sample="${encodeURIComponent(sample)}">ลองฟังเสียง</button></div>`;
  }).join('');
  app.innerHTML=header()+`<section class="card"><h2>ตั้งค่าเสียงสำหรับเด็ก</h2><p class="muted">เลือกเสียงผู้หญิงที่ฟังนุ่ม สดใส และชัดที่สุดในเครื่องนี้ได้เลย ระบบจะจำเสียงที่เลือกไว้ในอุปกรณ์นี้ และจะไม่เปลี่ยนไปใช้เสียงผู้ชายอัตโนมัติ</p>${rows}<p class="voice-help">ถ้ารายการของภาษาไทยขึ้นว่า “ไม่พบเสียงผู้หญิง” แปลว่าเบราว์เซอร์/เครื่องนี้ไม่ได้ส่งเสียงผู้หญิงไทยให้เว็บไซต์ใช้ จึงต้องเพิ่มเสียงภาษาไทยในตั้งค่าของเครื่องก่อน</p><button class="btn gold" id="voiceDone">เสร็จแล้ว</button></section>`;
  document.querySelectorAll('.voice-select').forEach(sel=>{
    sel.onchange=()=>{state.voicePrefs=state.voicePrefs||{};state.voicePrefs[sel.dataset.base]=sel.value;save();};
    if(!state.voicePrefs?.[sel.dataset.base] && sel.value){state.voicePrefs=state.voicePrefs||{};state.voicePrefs[sel.dataset.base]=sel.value;save();}
  });
  document.querySelectorAll('.voice-test').forEach(b=>b.onclick=()=>{
    const sel=document.querySelector(`.voice-select[data-base="${b.dataset.base}"]`);
    if(sel&&sel.value){state.voicePrefs=state.voicePrefs||{};state.voicePrefs[b.dataset.base]=sel.value;save();}
    const ok=speak(decodeURIComponent(b.dataset.sample),b.dataset.lang);
    if(!ok)alert('ยังไม่พบเสียงผู้หญิงสำหรับภาษานี้ในเครื่องครับ');
  });
  $('#voiceDone').onclick=home;
}

const emojiArt={"🐱":"cat","🐶":"dog","🐄":"cow","🐔":"hen","🍎":"apple","🥕":"carrot","🥦":"broccoli","📚":"books","⚽":"ball","🪁":"kite","☀️":"sunny","☁️":"cloudy","🌧️":"rainy","🔴":"circle","🟦":"square","🔺":"triangle","👩‍⚕️":"doctor","👨‍⚕️":"doctor","👮":"police","👩‍🚒":"firefighter","👨‍🚒":"firefighter"};
function artify(x){x=String(x);const key=emojiArt[x.trim()];if(key&&ART[key])return `<img class="picimg" src="${ART[key]}" alt="">`;return x.replace(/👩‍⚕️|👨‍⚕️|👩‍🚒|👨‍🚒|👮/g,'').replace(/[👧👦👶🙂😊]/g,'');}

function showQ(){locked=false;attempts=0;let q=round[qi];let opts=sh(q.opts);app.innerHTML=header()+`<section class="card"><div class="row"><b>${current.name}</b><span class="pill">ข้อ ${qi+1}/10 • คะแนน ${score}</span></div><div class="bar"><div style="width:${qi*10}%"></div></div><div class="q">${q.q}</div><div class="visual">${artify(q.v||'')}</div><div class="center"><button class="btn soft" id="listen">ฟังคำถาม</button></div><div class="choices">${opts.map((x,i)=>`<button class="choice ${String(x).length>4?'text':''}" data-v="${encodeURIComponent(x)}">${artify(x)}</button>`).join('')}</div><div id="fb"></div><div class="center"><button class="btn soft" id="quit">กลับหน้า Station</button></div></section>`;$('#listen').onclick=()=>speak(q.q,q.lang);$('#quit').onclick=home;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,decodeURIComponent(b.dataset.v)));}
function answer(btn,val){if(locked)return;let q=round[qi];attempts++;if(val===q.a){locked=true;btn.classList.add('correct','celebrate');score++;state.stars=(state.stars||0)+1;save();yay();document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="feedback"><div class="yay">เย้! เก่งมาก!</div><div class="explain">${q.ex}</div><button class="btn soft" id="hearEx">ฟังเฉลย</button><button class="btn gold" id="next">${qi==9?'ดูคะแนน':'ข้อต่อไป'}</button></div>`;$('#hearEx').onclick=()=>speak(q.ex,q.lang==='en-US'?'th-TH':q.lang);$('#next').onclick=()=>{qi++;qi>=10?finish():showQ()}}else{btn.classList.add('wrong');btn.disabled=true;$('#fb').innerHTML=`<div class="feedback" style="background:#fff0f3;border-color:#e5a9b5"><div class="explain">ยังไม่ใช่นะ ลองอีกครั้งได้เลย</div></div>`;speak('ลองอีกครั้งนะ','th-TH')}}
function finish(){let rec={date:new Date().toLocaleDateString('th-TH'),ts:Date.now(),subject:current.name,id:current.id,score,total:10};state.history=state.history||[];state.history.push(rec);state.history=state.history.slice(-100);save();app.innerHTML=header()+`<section class="card center"><div style="font-size:80px">${score==10?'🏆🎉':'🌟'}</div><h2>${state.player} ได้ ${score}/10</h2><p class="explain">${score>=9?'สุดยอดมาก!':score>=7?'เก่งมาก ฝึกอีกนิดก็เต็มแล้ว!':'ทำได้ดีแล้ว ลองเล่นอีกครั้งนะ!'}</p><p>บันทึกคะแนนวันนี้เรียบร้อย 📊</p><button class="btn gold" id="again">🔄 เล่นใหม่ (สุ่มชุดใหม่)</button><button class="btn soft" id="prog">📊 ดูพัฒนาการ</button><button class="btn soft" id="home">🏠 Station</button></section>`;if(score==10)yay();$('#again').onclick=()=>startSubject(current.id);$('#prog').onclick=progress;$('#home').onclick=home}
function progress(){let h=(state.history||[]).slice().reverse();let by={};(state.history||[]).forEach(r=>{(by[r.id]??=[]).push(r.score)});app.innerHTML=header()+`<section class="card"><div class="row"><h2>พัฒนาการของ ${state.player}</h2><button class="btn soft" id="back">← กลับ</button></div><div class="grid">${subjects.map(s=>{let a=by[s.id]||[];let avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10):0;let best=a.length?Math.max(...a):'-';return `<div class="card"><b>${s.name}</b><p>เล่น ${a.length} รอบ • ดีที่สุด <b>${best}${best==='-'?'':'/10'}</b></p><div class="bar"><div style="width:${avg}%"></div></div><small>คะแนนเฉลี่ย ${avg}%</small></div>`}).join('')}</div><h3>🗓️ ประวัติล่าสุด</h3>${h.length?`<table class="history"><thead><tr><th>วันที่</th><th>วิชา</th><th>คะแนน</th></tr></thead><tbody>${h.slice(0,30).map(r=>`<tr><td>${r.date}</td><td>${r.subject}</td><td><b>${r.score}/${r.total}</b></td></tr>`).join('')}</tbody></table>`:'<p class="muted">ยังไม่มีคะแนน ลองเล่น Station แรกกันเลย 🌟</p>'}</section>`;$('#back').onclick=home}
state.player?home():welcome();
</script></body></html>
