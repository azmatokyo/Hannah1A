function makeRound(t){if(t>=5){return shuffle(PICTURE_BANK[t]).map(r=>({q:r[0],visual:r[1],opts:shuffle(r.slice(2)),correct:r[2],picture:true}))}if(t===4)return shuffle(SHAPE_QUIZ).map(r=>({q:'แตะรูปที่เหมือนกัน 👇',visual:r[0],opts:shuffle(r.slice(1)),correct:r[1]}));if(t<3)return shuffle(DATA.letters).slice(0,10).map(l=>{let others=shuffle(DATA.letters.filter(v=>v[0]!==l[0])).slice(0,2);let opts=t===2?shuffle([l[0],...others.map(v=>v[0])]):shuffle([l[0],...others.map(v=>v[0])]);return {q:t===0?'ตัวไหนคือ '+l[0]+' '+l[1]+'?':t===1?'ภาพนี้ขึ้นต้นด้วยตัวอะไร?':'แตะตัวอักษรที่เหมือนกัน',visual:t===1?l[2]+' '+l[1]:t===2?l[0]:'',opts,correct:l[0]}});return shuffle(DATA.raw[t]).map(r=>({q:t===3?'นับดูสิ มีกี่อัน?':r[0],visual:t===3?r[0]:'',opts:shuffle(r.slice(1)),correct:r[1]}))}
function persist(){try{localStorage.setItem('hannahStars',String(stars));localStorage.setItem('hannahBest',JSON.stringify(best))}catch(e){}}
function play(kind){
 if(!soundOn)return;
 const status=$('soundStatus');
 const player=$('sfx-'+kind);
 if(!player){if(status)status.textContent='ไม่พบไฟล์เสียง';return;}
 try{
  player.pause();player.currentTime=0;player.volume=1;
  const result=player.play();
  if(result&&typeof result.catch==='function')result.catch(e=>{if(status)status.textContent='🔇 Safari เล่นเสียงไม่ได้: '+e.message;});
  if(status)status.textContent='🔊 เปิดเสียงแล้ว • หากไม่ได้ยิน ตรวจสอบระดับเสียง iPad และ Bluetooth';
 }catch(e){if(status)status.textContent='🔇 '+e.message;}
}
function updateHeader(){$('total').textContent='⭐ '+stars+' ดาวสะสม';$('sound').textContent=soundOn?'🔊 เปิดเสียงอยู่':'🔇 ปิดเสียงอยู่'}
$('testSound').onclick=()=>play('reward');
$('sound').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('hannahSound',soundOn?'on':'off')}catch(e){}updateHeader();if(soundOn)play('correct')};

if(page==='result'){a.innerHTML='<div class="panel center"><div class="visual">🏅🌟🏅</div><h2>ฮันนาห์เก่งมาก!</h2><p class="question">'+score+' / 10 ⭐</p><p class="muted">ทำครบ 10 ข้อแล้ว ได้เหรียญความพยายาม!</p><div class="stars">'+('⭐'.repeat(score)||'💗')+'</div><button class="action gold" id="again">🎲 เล่นอีกครั้ง</button><button class="action secondary" id="home">🏠 เลือกบทเรียนอื่น</button></div>';$('again').onclick=()=>start(topic);$('home').onclick=()=>{page='home';render()};return}
const q=round[index],correctIndex=q.opts.indexOf(q.correct);a.innerHTML='<div class="panel"><div class="row"><button class="action secondary" id="home">← เลือกบทเรียน</button><span class="bigscore">ข้อ '+(index+1)+' / 10</span></div><p class="muted center">'+esc(DATA.topics[topic])+'</p><div class="bar"><div style="width:'+((index+1)*10)+'%"></div></div><div class="stars center">'+Array.from({length:10},(_,i)=>i<score?'⭐':'☆').join('')+'</div><div class="question">'+esc(q.q)+'</div>'+(q.visual?(topic===4?'<div class="visual shape-target">'+shapePicture(q.visual)+'</div>':'<div class="visual">'+esc(q.visual)+'</div>'):'')+'<div class="'+(topic===4?'shape-choices':q.picture?'picture-choices':'')+'">'+q.opts.map((o,i)=>'<button class="choice '+(picked===i?(i===correctIndex?'correct':'wrong'):'')+'" data-answer="'+i+'" '+(picked!==-1?'disabled':'')+' aria-label="ตัวเลือก '+(i+1)+'">'+(topic===4?shapePicture(o):esc(o))+'</button>').join('')+'</div>'+(picked!==-1?'<div class="feedback '+(picked===correctIndex?'':'bad')+'">'+(picked===correctIndex?'<div class="burst">🌟 ⭐ 🌟</div><p>เย้! เก่งมากฮันนาห์!</p><p>+1 ดาว ⭐</p>':'<div class="burst">💗</div><p>ลองใหม่ข้อถัดไปนะ</p><p>คำตอบคือ '+esc(q.correct)+'</p>')+'</div><button class="action gold" id="next">'+(index===9?'🏅 รับเหรียญรางวัล':'➡️ ข้อถัดไป')+'</button>':'')+'</div>';$('home').onclick=()=>{page='home';render()};a.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));if(picked!==-1)$('next').onclick=next;
}
function start(t){topic=t;round=makeRound(t);index=0;picked=-1;score=0;page='quiz';render()}
function answer(i){if(picked!==-1)return;picked=i;if(round[index].opts[i]===round[index].correct){score++;stars++;persist();play('correct')}else play('wrong');render()}
function next(){if(picked===-1)return;if(index===9){best[topic]=Math.max(best[topic]||0,score);persist();page='result';render();play('reward')}else{index++;picked=-1;render()}}
render();
</script></body></html>
