<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Star School 🌟</title><meta name="theme-color" content="#fff4bd"><style>
:root{font-family:"Trebuchet MS","Arial Rounded MT Bold","Noto Sans Thai",system-ui,-apple-system,sans-serif;color:#46364b;background:#fffaf0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff8dd,#fff)}main{max-width:980px;margin:auto;padding:14px 14px 70px}.card,.hero{background:#fff;border:3px solid #ead7e8;border-radius:26px;padding:18px;margin:12px 0;box-shadow:0 5px 0 #eee1e9}.hero{text-align:center;background:linear-gradient(135deg,#fff0a8,#ffd1e6,#d8f2ff);border-color:#efc34d}h1{font-size:clamp(32px,6vw,58px);margin:5px;color:#8b4c78}h2{font-size:clamp(26px,4.5vw,40px);margin:8px}h3{font-size:clamp(22px,3.4vw,30px)}p{line-height:1.55}.btn,.subject,.choice,.age{font:inherit;cursor:pointer;touch-action:manipulation}.btn{border:0;border-radius:17px;padding:15px 18px;margin:6px;font-size:clamp(19px,3vw,27px);font-weight:850;background:#9654b1;color:white}.btn.gold{background:#edab18;color:#4c3300}.btn.soft{background:#f5e8f7;color:#664172;border:2px solid #d7b9dc}.btn.danger{background:#fff0f0;color:#9b3535;border:2px solid #e5a7a7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{position:relative;overflow:hidden;border:3px solid #e5d4e5;border-radius:28px;background:linear-gradient(145deg,#fff,#fff9fd);padding:18px;min-height:190px;text-align:left;font-weight:900;font-size:clamp(21px,3.4vw,30px);box-shadow:0 8px 18px #eadfeb80;transition:.15s transform}.subject:active{transform:scale(.98)}.subject .subtop{display:flex;align-items:center;justify-content:space-between;gap:12px}.subject .subname{font-size:clamp(24px,3.5vw,34px);letter-spacing:-.4px}.subject .mascot{font-size:64px;filter:drop-shadow(0 4px 2px #0001)}.subject.thai{background:linear-gradient(145deg,#fff5fb,#fff)}.subject.math{background:linear-gradient(145deg,#fff8d9,#fff)}.subject.learn{background:linear-gradient(145deg,#eaf9ff,#fff)}.subject.iq{background:linear-gradient(145deg,#f1ecff,#fff)}.subject.eng{background:linear-gradient(145deg,#eef1ff,#fff7fb)}.subject.arabic{background:linear-gradient(145deg,#ecfff1,#fffbed)}.subject.islam{background:linear-gradient(145deg,#eafaf1,#fff)}.subject small{display:block;font-size:16px;font-weight:600;color:#7b687a;margin-top:7px}.topic{min-height:105px}.input{width:100%;font:inherit;font-size:28px;padding:15px;border:3px solid #dbc6df;border-radius:16px;text-align:center}.ages{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.age{font-size:26px;font-weight:900;border:3px solid #e1c9df;background:#fff;border-radius:18px;padding:14px 20px}.age.sel{background:#ffe59b;border-color:#e3aa16}.q{font-size:clamp(29px,5vw,49px);font-weight:900;text-align:center;margin:14px 0}.visual{text-align:center;font-size:clamp(64px,12vw,120px);line-height:1.3;min-height:100px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{border:4px solid #ead8e8;background:#fffdf8;border-radius:22px;min-height:130px;padding:10px;font-size:clamp(34px,7vw,72px);font-weight:900;overflow-wrap:anywhere}.choice.text{font-size:clamp(23px,4vw,38px)}.choice.correct{background:#dcf8df;border-color:#42aa63}.choice.wrong{background:#ffe5e8;border-color:#df7081}.feedback{border-radius:22px;padding:15px;text-align:center;background:#fff1ae;border:3px solid #edbb2d;margin-top:14px}.feedback .yay{font-size:clamp(42px,8vw,78px);font-weight:1000}.explain{font-size:clamp(19px,3vw,27px);font-weight:700}.bar{height:15px;background:#eee5ed;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:#edb42b}.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:7px 12px;border-radius:99px;background:#fff1ba;font-weight:800}.muted{color:#776878;font-size:16px}.hidden{display:none!important}.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}.matchcol{display:grid;gap:10px}.matchbtn{min-height:90px;border:3px solid #decde0;border-radius:18px;background:white;font-size:clamp(30px,6vw,60px);font-weight:900}.matchbtn.selected{outline:5px solid #f0b62c}.matchbtn.done{background:#ddf7e1;border-color:#5ab874}.history{width:100%;border-collapse:collapse}.history th,.history td{padding:9px;border-bottom:1px solid #eaddea;text-align:left}.badge{font-size:17px;background:#eaf7ff;border-radius:12px;padding:5px 9px}.celebrate{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.15)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.choices{grid-template-columns:repeat(3,1fr)}.choice{min-height:105px}.card{padding:14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.subject{padding:0;min-height:250px;text-align:center}.subject .subtop{display:block}.subject-art{width:100%;height:145px;object-fit:cover;display:block;border-radius:24px 24px 0 0}.subject-copy{padding:15px 16px 17px}.subject .subname{display:block;font-size:clamp(25px,3.5vw,35px);font-weight:850;color:#493a67}.subject small{font-size:16px;line-height:1.45}.subject .mascot{display:none!important}.hero h1{font-family:"Arial Rounded MT Bold","Avenir Next Rounded","Noto Sans Thai",system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
</style></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s), app=document.getElementById('app');
const SKEY='littleStarSchool_v2'; let state={player:null,age:null,stars:0,history:[],sound:true}; try{state={...state,...JSON.parse(localStorage.getItem(SKEY)||'{}')}}catch(e){};
const save=()=>localStorage.setItem(SKEY,JSON.stringify(state)); const sh=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=(q,v,a,opts,ex,lang='th-TH',type='choice')=>({q,v,a,opts,ex,lang,type});
const thaiLetters=[['ก','🐔','ไก่'],['ข','🥚','ไข่'],['ค','🐃','ควาย'],['ง','🐍','งู'],['จ','🍽️','จาน'],['ช','🐘','ช้าง'],['ด','👶','เด็ก'],['ต','🐢','เต่า'],['น','🐭','หนู'],['บ','🍃','ใบไม้'],['ป','🐟','ปลา'],['ผ','🐝','ผึ้ง'],['ม','🐎','ม้า'],['ร','⛵','เรือ'],['ล','🐒','ลิง'],['ส','🐯','เสือ'],['ห','📦','หีบ'],['อ','🛁','อ่าง']];
const thai=thaiLetters.flatMap(([l,p,w])=>[Q(`ตัวไหนคือ ${l} ${w}?`,p,l,sh([l,...sh(thaiLetters.filter(x=>x[0]!=l)).slice(0,2).map(x=>x[0])]),`${l} คือพยัญชนะในคำว่า ${w}`),Q('ภาพนี้ขึ้นต้นด้วยตัวอะไร?',`${p} ${w}`,l,sh([l,...sh(thaiLetters.filter(x=>x[0]!=l)).slice(0,2).map(x=>x[0])]),`คำว่า ${w} เริ่มต้นด้วย ${l}`)]);
const math=[]; for(let n=1;n<=10;n++){let ico=['⭐','🍎','🐟','🌸','🧸'][n%5];math.push(Q('นับดูสิ มีกี่อัน?',ico.repeat(n),String(n),sh([String(n),String(Math.max(1,n-1)),String(Math.min(10,n+1))]),`นับทีละอัน ได้ทั้งหมด ${n} อัน`));math.push(Q(`แตะเลข ${n}`,'🔢',String(n),sh([String(n),String((n%10)+1),String(((n+1)%10)+1)]),`นี่คือเลข ${n}`))} math.push(Q('รูปไหนเป็นวงกลม?','🔴 🔺 🟦','🔴',['🔴','🔺','🟦'],'วงกลมมีเส้นโค้งรอบ ๆ และไม่มีมุม'),Q('รูปไหนเป็นสามเหลี่ยม?','🔺 🔴 🟦','🔺',['🔺','🔴','🟦'],'สามเหลี่ยมมี 3 ด้านและ 3 มุม'));
const learn=[Q('เราใช้อะไรมอง?','🙂','👀',['👀','👂','👃'],'เราใช้ตา 👀 สำหรับมองเห็น'),Q('เราใช้อะไรฟัง?','🎵','👂',['👂','👀','🦶'],'เราใช้หู 👂 สำหรับฟังเสียง'),Q('ห้องไหนใช้นอน?','🏠','🛏️',['🛏️','🚿','🍳'],'ห้องนอนมีเตียงสำหรับนอนพัก'),Q('ห้องไหนใช้อาบน้ำ?','🏠','🚿',['🚿','🛏️','🍳'],'เราอาบน้ำในห้องน้ำ'),Q('ใครรักษาคนป่วย?','🤒','👩‍⚕️',['👩‍⚕️','👩‍🏫','👩‍🍳'],'คุณหมอช่วยตรวจและรักษาคนป่วย'),Q('ใครดับไฟ?','🔥','👩‍🚒',['👩‍🚒','👩‍✈️','👩‍🌾'],'นักดับเพลิงช่วยดับไฟและช่วยเหลือผู้คน'),Q('อันไหนเป็นผัก?','🍽️','🥦',['🥦','🍭','🍪'],'ผักเป็นอาหารที่มีประโยชน์ต่อร่างกาย'),Q('หิวน้ำ ดื่มอะไรดี?','🥤','💧',['💧','🥤','🍭'],'น้ำสะอาดช่วยให้ร่างกายสดชื่น'),Q('ก่อนกินข้าวทำอะไร?','🍚','🧼👐',['🧼👐','🏃','😴'],'ล้างมือก่อนกินอาหารช่วยให้มือสะอาด'),Q('เล่นของเล่นเสร็จทำอะไร?','🧸','🧸📦',['🧸📦','🧸💥','🧸🗑️'],'เล่นเสร็จแล้วเก็บของเล่นเข้าที่')];
const iq=[Q('รูปไหนไม่เหมือนเพื่อน?','🍎 🍎 🚗','🚗',['🍎','🚗','🍎'],'รถไม่ใช่ผลไม้ จึงต่างจากแอปเปิล'),Q('อะไรคู่กับกระต่าย?','🐰','🥕',['🥕','🍌','🐟'],'กระต่ายชอบกินแครอต'),Q('อะไรคู่กับลิง?','🐒','🍌',['🍌','🥕','🐟'],'ลิงกับกล้วยเป็นคู่ภาพที่สัมพันธ์กัน'),Q('อะไรคู่กับตา?','👀','🌈',['🌈','🔔','🌸'],'เราใช้ตามองเห็นสิ่งต่าง ๆ'),Q('อะไรคู่กับหู?','👂','🔔',['🔔','🌈','🍎'],'เราใช้หูฟังเสียงระฆัง'),Q('ตัวไหนใหญ่กว่า?','🐘 🐭','🐘',['🐘','🐭','🐜'],'ช้างมีตัวใหญ่กว่าหนู'),Q('ตัวไหนเล็กกว่า?','🐘 🐜','🐜',['🐜','🐘','🐎'],'มดมีตัวเล็กกว่าช้าง'),Q('อะไรอยู่ในน้ำ?','🌊','🐟',['🐟','🐔','🐘'],'ปลาอาศัยและว่ายอยู่ในน้ำ')];
const eng=[];
const engAZ=[['A','🍎','Apple'],['B','⚽','Ball'],['C','🐱','Cat'],['D','🐶','Dog'],['E','🐘','Elephant'],['F','🐟','Fish'],['G','🦒','Giraffe'],['H','🏠','House'],['I','🍦','Ice cream'],['J','🧃','Juice'],['K','🔑','Key'],['L','🦁','Lion'],['M','🐒','Monkey'],['N','👃','Nose'],['O','🍊','Orange'],['P','🐼','Panda'],['Q','👑','Queen'],['R','🐰','Rabbit'],['S','⭐','Star'],['T','🐯','Tiger'],['U','☂️','Umbrella'],['V','🎻','Violin'],['W','⌚','Watch'],['X','🎼','Xylophone'],['Y','🪀','Yo-yo'],['Z','🦓','Zebra']];
engAZ.forEach(([l,p,w])=>{eng.push(Q(`Touch ${l}`,p,l,sh([l,...sh(engAZ.filter(x=>x[0]!=l)).slice(0,2).map(x=>x[0])]),`${l} is for ${w}.`,'en-US'));eng.push(Q(`Which one is ${w}?`,l,p,sh([p,...sh(engAZ.filter(x=>x[1]!=p)).slice(0,2).map(x=>x[1])]),`${w} starts with ${l}.`,'en-US'))});
[['RED','🔴'],['BLUE','🔵'],['YELLOW','🟡'],['GREEN','🟢'],['PINK','🩷'],['ORANGE','🟠']].forEach(([w,p],i,a)=>eng.push(Q(`Touch ${w}`,'🎨',p,sh([p,...sh(a.filter(x=>x[1]!=p)).slice(0,2).map(x=>x[1])]),`${w} is this color.`,'en-US')));
[['SUNNY','☀️'],['RAINY','🌧️'],['CLOUDY','☁️'],['SNOWY','🌨️']].forEach(([w,p],i,a)=>eng.push(Q(`Which picture is ${w}?`,'🌤️',p,sh([p,...sh(a.filter(x=>x[1]!=p)).slice(0,2).map(x=>x[1])]),`${w} describes this weather.`,'en-US')));
[['COW','🐄'],['PIG','🐷'],['CHICKEN','🐔'],['HORSE','🐴'],['SHEEP','🐑'],['DUCK','🦆']].forEach(([w,p],i,a)=>eng.push(Q(`Where is the ${w}?`,'🚜',p,sh([p,...sh(a.filter(x=>x[1]!=p)).slice(0,2).map(x=>x[1])]),`This is a ${w}.`,'en-US')));
const arabic=[];
const ar=[['ا','🐇','أرنب','กระต่าย'],['ب','🏠','بيت','บ้าน'],['ت','🍎','تفاحة','แอปเปิล'],['ث','🐍','ثعبان','งู'],['ج','🥕','جزر','แครอต'],['ح','🐎','حصان','ม้า'],['خ','🐑','خروف','แกะ'],['د','🐔','دجاجة','ไก่'],['ذ','🌽','ذرة','ข้าวโพด'],['ر','🍚','رز','ข้าว'],['ز','🌸','زهرة','ดอกไม้'],['س','🐟','سمكة','ปลา'],['ش','☀️','شمس','ดวงอาทิตย์'],['ص','🦅','صقر','เหยี่ยว'],['ض','🐸','ضفدع','กบ'],['ط','✈️','طائرة','เครื่องบิน'],['ظ','✉️','ظرف','ซองจดหมาย'],['ع','👁️','عين','ตา'],['غ','☁️','غيمة','ก้อนเมฆ'],['ف','🐘','فيل','ช้าง'],['ق','🌙','قمر','ดวงจันทร์'],['ك','📖','كتاب','หนังสือ'],['ل','🍋','ليمون','มะนาว'],['م','🍌','موز','กล้วย'],['ن','⭐','نجمة','ดาว'],['ه','🎁','هدية','ของขวัญ'],['و','🌹','وردة','ดอกกุหลาบ'],['ي','✋','يد','มือ']];
ar.forEach(([l,p,w,th])=>{arabic.push(Q(`แตะตัวอักษร ${l}`,p,l,sh([l,...sh(ar.filter(x=>x[0]!=l)).slice(0,2).map(x=>x[0])]),`${l} เป็นตัวอักษรอาหรับ และคำว่า ${w} หมายถึง ${th}`,'ar'));arabic.push(Q(`คำว่า ${w} คือภาพไหน?`,l,p,sh([p,...sh(ar.filter(x=>x[1]!=p)).slice(0,2).map(x=>x[1])]),`${w} หมายถึง ${th}`,'ar'))});
const fam=[['أب','👨','พ่อ'],['أم','👩','แม่'],['أخ','👦','พี่หรือน้องชาย'],['أخت','👧','พี่หรือน้องสาว']];fam.forEach(([w,p,th],i,a)=>arabic.push(Q(`คำว่า ${w} คือใคร?`,'👨‍👩‍👧‍👦',p,sh([p,...sh(a.filter(x=>x[1]!=p)).slice(0,2).map(x=>x[1])]),`${w} หมายถึง ${th}`,'ar')));

let selectedAge=state.age||4, selectedAvatar='star', current=null,round=[],qi=0,score=0,attempts=0,locked=false;
function header(){return `<div class="hero"><h1>LITTLE STAR SCHOOL</h1>${state.player?`<div><b>${state.player}</b> • อายุ ${state.age} ปี • ⭐ ${state.stars||0} ดาว</div>`:''}</div>`}
function welcome(){app.innerHTML=header()+`<section class="card center"><h2>สวัสดีหนูน้อยคนเก่ง 👋</h2><p>เกมเรียนรู้สำหรับเด็กปฐมวัยประมาณ <b>3–5 ปี</b></p><button id="helloSound" class="btn soft">🔊 แตะเพื่อเริ่มสนุก!</button><div id="soundReady" class="muted"></div><label><b>หนูชื่ออะไรเอ่ย?</b></label><input id="name" class="input" maxlength="24" value="${state.player||''}" placeholder="ชื่อเล่น"><h3>หนูอายุเท่าไหร่?</h3><div class="ages">${[3,4,5].map(a=>`<button class="age ${selectedAge==a?'sel':''}" data-age="${a}">${a} ปี</button>`).join('')}</div><p class="muted">💡 แนะนำเล่นครั้งละประมาณ 10–15 นาที แล้วพักสายตาและขยับร่างกาย</p><button id="start" class="btn gold">เริ่มเรียน</button></section>`;document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{selectedAge=+b.dataset.age;welcome()});welcome()});$('#helloSound').onclick=()=>{state.sound=true;save();speak('สวัสดีหนูน้อยคนเก่ง ยินดีต้อนรับสู่ Little Star School','th-TH');$('#soundReady').textContent='🔊 เสียงพร้อมแล้ว';};$('#start').onclick=()=>{let n=$('#name').value.trim();if(!n)return alert('ใส่ชื่อก่อนนะครับ 🌟');state.player=n;state.age=selectedAge;save();speak(`สวัสดี ${n} พร้อมมาเรียนรู้และสนุกกันหรือยัง?`,'th-TH');setTimeout(home,1200)}}
function home(){app.innerHTML=header()+`<div class="row"><h2>เลือก Station</h2><div><button class="btn soft" id="progress">พัฒนาการ</button><button class="btn soft" id="sound">${state.sound?'🔊':'🔇'} เสียง</button></div></div><div class="grid">${subjects.map(s=>`<button class="subject ${s.id}" data-id="${s.id}"><img class="subject-art" src="${subjectArt[s.id]}" alt=""><div class="subject-copy"><span class="subname">${s.name}</span><small>${s.desc}</small><small>เนื้อหาหลัก + แบบฝึกเสริม</small></div></button>`).join('')}</div><section class="card"><b>สำหรับผู้ปกครอง</b><p class="muted">คำถามสุ่มใหม่ทุกครั้ง มีเสียงอ่านโจทย์ เฉลยสั้น ๆ และบันทึกคะแนนไว้ในอุปกรณ์เครื่องนี้</p><button class="btn soft" id="player">เปลี่ยนผู้เล่น</button><button class="btn danger" id="reset">รีเซ็ตทั้งหมด</button></section>`;document.querySelectorAll('.subject').forEach(b=>b.onclick=()=>startSubject(b.dataset.id));$('#progress').onclick=progress;$('#sound').onclick=()=>{state.sound=!state.sound;save();home()};$('#player').onclick=()=>{state.player=null;save();welcome()};$('#reset').onclick=()=>{if(confirm('ลบชื่อ ดาว และประวัติคะแนนทั้งหมดใช่ไหม?')){localStorage.removeItem(SKEY);location.reload()}}}
function startSubject(id){current=subjects.find(s=>s.id==id);let bank=[...current.bank]; while(bank.length<10)bank=[...bank,...current.bank];round=sh(bank).slice(0,10);qi=0;score=0;attempts=0;showQ()}
function pickKidVoice(lang){
  const voices=speechSynthesis.getVoices();
  const base=(lang||'th-TH').split('-')[0].toLowerCase();
  const same=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(base));
  const femaleHints=/female|siri|kanya|narisa|samantha|victoria|zira|ava|fiona|moira|tessa|veena|lekha|amelie|alice|anna|joana|maria|salma|maged/i;
  const maleHints=/male|daniel|alex|fred|thomas|ralph|bruce|jorge|carlos|yuri/i;
  return same.find(v=>femaleHints.test(v.name)&&!maleHints.test(v.name)) || same.find(v=>!maleHints.test(v.name)) || same[0] || null;
}
function speak(text,lang){
  if(!state.sound||!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const locale=lang||'th-TH';
  let u=new SpeechSynthesisUtterance(text);
  u.lang=locale;
  u.rate=1.0;
  u.pitch=1.18;
  u.volume=1;
  const v=pickKidVoice(locale); if(v)u.voice=v;
  speechSynthesis.speak(u);
}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();speechSynthesis.getVoices();}
function yay(){if(!state.sound)return;try{let ac=new (AudioContext||webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(520,ac.currentTime);o.frequency.exponentialRampToValueAtTime(900,ac.currentTime+.18);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.start();o.stop(ac.currentTime+.36)}catch(e){};setTimeout(()=>speak('เย้! เก่งมาก!','th-TH'),80)}
function showQ(){locked=false;attempts=0;let q=round[qi];let opts=sh(q.opts);app.innerHTML=header()+`<section class="card"><div class="row"><b>${current.name}</b><span class="pill">ข้อ ${qi+1}/10 • ⭐ ${score}</span></div><div class="bar"><div style="width:${qi*10}%"></div></div><div class="q">${q.q}</div><div class="visual">${q.v||''}</div><div class="center"><button class="btn soft" id="listen">🔊 ฟังคำถาม</button></div><div class="choices">${opts.map((x,i)=>`<button class="choice ${String(x).length>4?'text':''}" data-v="${encodeURIComponent(x)}">${x}</button>`).join('')}</div><div id="fb"></div><div class="center"><button class="btn soft" id="quit">🏠 กลับหน้า Station</button></div></section>`;$('#listen').onclick=()=>speak(q.q,q.lang);$('#quit').onclick=home;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,decodeURIComponent(b.dataset.v)));}
function answer(btn,val){if(locked)return;let q=round[qi];attempts++;if(val===q.a){locked=true;btn.classList.add('correct','celebrate');score++;state.stars=(state.stars||0)+1;save();yay();document.querySelectorAll('.choice').forEach(x=>x.disabled=true);$('#fb').innerHTML=`<div class="feedback"><div class="yay">🎉 เย้! ⭐</div><div class="explain">${q.ex}</div><button class="btn soft" id="hearEx">🔊 ฟังเฉลย</button><button class="btn gold" id="next">${qi==9?'ดูคะแนน 🏆':'ข้อต่อไป ➜'}</button></div>`;$('#hearEx').onclick=()=>speak(q.ex,q.lang==='en-US'?'th-TH':q.lang);$('#next').onclick=()=>{qi++;qi>=10?finish():showQ()}}else{btn.classList.add('wrong');btn.disabled=true;$('#fb').innerHTML=`<div class="feedback" style="background:#fff0f3;border-color:#e5a9b5"><div class="explain">😊 ยังไม่ใช่นะ ลองอีกครั้งได้เลย</div></div>`;speak('ลองอีกครั้งนะ','th-TH')}}
function finish(){let rec={date:new Date().toLocaleDateString('th-TH'),ts:Date.now(),subject:current.name,id:current.id,score,total:10};state.history=state.history||[];state.history.push(rec);state.history=state.history.slice(-100);save();app.innerHTML=header()+`<section class="card center"><div style="font-size:80px">${score==10?'🏆🎉':'🌟'}</div><h2>${state.player} ได้ ${score}/10</h2><p class="explain">${score>=9?'สุดยอดมาก!':score>=7?'เก่งมาก ฝึกอีกนิดก็เต็มแล้ว!':'ทำได้ดีแล้ว ลองเล่นอีกครั้งนะ!'}</p><p>บันทึกคะแนนวันนี้เรียบร้อย 📊</p><button class="btn gold" id="again">🔄 เล่นใหม่ (สุ่มชุดใหม่)</button><button class="btn soft" id="prog">📊 ดูพัฒนาการ</button><button class="btn soft" id="home">🏠 Station</button></section>`;if(score==10)yay();$('#again').onclick=()=>startSubject(current.id);$('#prog').onclick=progress;$('#home').onclick=home}
function progress(){let h=(state.history||[]).slice().reverse();let by={};(state.history||[]).forEach(r=>{(by[r.id]??=[]).push(r.score)});app.innerHTML=header()+`<section class="card"><div class="row"><h2>พัฒนาการของ ${state.player}</h2><button class="btn soft" id="back">← กลับ</button></div><div class="grid">${subjects.map(s=>{let a=by[s.id]||[];let avg=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10):0;let best=a.length?Math.max(...a):'-';return `<div class="card"><b>${s.name}</b><p>เล่น ${a.length} รอบ • ดีที่สุด <b>${best}${best==='-'?'':'/10'}</b></p><div class="bar"><div style="width:${avg}%"></div></div><small>คะแนนเฉลี่ย ${avg}%</small></div>`}).join('')}</div><h3>🗓️ ประวัติล่าสุด</h3>${h.length?`<table class="history"><thead><tr><th>วันที่</th><th>วิชา</th><th>คะแนน</th></tr></thead><tbody>${h.slice(0,30).map(r=>`<tr><td>${r.date}</td><td>${r.subject}</td><td><b>${r.score}/${r.total}</b></td></tr>`).join('')}</tbody></table>`:'<p class="muted">ยังไม่มีคะแนน ลองเล่น Station แรกกันเลย 🌟</p>'}</section>`;$('#back').onclick=home}
state.player?home():welcome();
</script></body></html>
