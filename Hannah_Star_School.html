function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function makeRound(t){if(t<3)return shuffle(DATA.letters).slice(0,10).map(l=>{let others=shuffle(DATA.letters.filter(v=>v[0]!==l[0])).slice(0,2);let opts=t===2?shuffle([l[0]+' '+l[1],...others.map(v=>v[0]+' '+v[1])]):shuffle([l[0],...others.map(v=>v[0])]);return {q:t===0?'ตัวไหนคือ '+l[0]+' '+l[1]+'?':t===1?'ภาพนี้ขึ้นต้นด้วยตัวอะไร?':'อ่านตัวอักษรนี้ว่าอะไร?',visual:t===1?l[2]+' '+l[1]:t===2?l[0]:'',opts,correct:t===2?l[0]+' '+l[1]:l[0]}});return shuffle(DATA.raw[t]).map(r=>({q:t===3?'นับดูสิ มีกี่อัน?':r[0],visual:t===3?r[0]:'',opts:shuffle(r.slice(1)),correct:r[1]}))}

$('sound').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('hannahSound',soundOn?'on':'off')}catch(e){}updateHeader();if(soundOn)play('correct')};
function render(){updateHeader();let a=$('app');if(page==='home'){a.innerHTML='<div class="panel"><h2>เลือกบทเรียนกันเลย 🎒</h2><p class="muted">17 หัวข้อ • หัวข้อละ 10 ข้อ • รวม 170 ข้อ<br>คุณแม่อ่านโจทย์ให้ฟัง แล้วฮันนาห์กดคำตอบเองได้เลย</p>'+groups.map(g=>'<div class="category"><h3>'+g[0]+'</h3>'+DATA.topics.slice(g[1],g[2]).map((t,i)=>'<button class="topic" data-topic="'+(g[1]+i)+'">'+esc(t)+'<small>10 ข้อ ⭐ คะแนนสูงสุด '+(best[g[1]+i]||0)+'/10</small></button>').join('')+'</div>').join('')+'</div>';a.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(Number(b.dataset.topic)));return}
if(page==='result'){a.innerHTML='<div class="panel center"><div class="visual">🏅🌟🏅</div><h2>ฮันนาห์เก่งมาก!</h2><p class="question">'+score+' / 10 ⭐</p><p class="muted">ทำครบ 10 ข้อแล้ว ได้เหรียญความพยายาม!</p><div class="stars">'+('⭐'.repeat(score)||'💗')+'</div><button class="action gold" id="again">🎲 เล่นอีกครั้ง</button><button class="action secondary" id="home">🏠 เลือกบทเรียนอื่น</button></div>';$('again').onclick=()=>start(topic);$('home').onclick=()=>{page='home';render()};return}
const q=round[index],correctIndex=q.opts.indexOf(q.correct);a.innerHTML='<div class="panel"><div class="row"><button class="action secondary" id="home">← เลือกบทเรียน</button><span class="bigscore">ข้อ '+(index+1)+' / 10</span></div><p class="muted center">'+esc(DATA.topics[topic])+'</p><div class="bar"><div style="width:'+((index+1)*10)+'%"></div></div><div class="stars center">'+Array.from({length:10},(_,i)=>i<score?'⭐':'☆').join('')+'</div><div class="question">'+esc(q.q)+'</div>'+(q.visual?'<div class="visual">'+esc(q.visual)+'</div>':'')+q.opts.map((o,i)=>'<button class="choice '+(picked===i?(i===correctIndex?'correct':'wrong'):'')+'" data-answer="'+i+'" '+(picked!==-1?'disabled':'')+'>'+esc(o)+'</button>').join('')+(picked!==-1?'<div class="feedback '+(picked===correctIndex?'':'bad')+'">'+(picked===correctIndex?'<div class="burst">🌟 ⭐ 🌟</div><p>เย้! เก่งมากฮันนาห์!</p><p>+1 ดาว ⭐</p>':'<div class="burst">💗</div><p>ลองใหม่ข้อถัดไปนะ</p><p>คำตอบคือ '+esc(q.correct)+'</p>')+'</div><button class="action gold" id="next">'+(index===9?'🏅 รับเหรียญรางวัล':'➡️ ข้อถัดไป')+'</button>':'')+'</div>';$('home').onclick=()=>{page='home';render()};a.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));if(picked!==-1)$('next').onclick=next;
}
function start(t){topic=t;round=makeRound(t);index=0;picked=-1;score=0;page='quiz';render()}
function answer(i){if(picked!==-1)return;picked=i;if(round[index].opts[i]===round[index].correct){score++;stars++;persist();play('correct')}else play('wrong');render()}
function next(){if(picked===-1)return;if(index===9){best[topic]=Math.max(best[topic]||0,score);persist();page='result';render();play('reward')}else{index++;picked=-1;render()}}
render();
</script></body></html>
